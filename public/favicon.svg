<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background rounded square -->
  <rect width="32" height="32" rx="7" fill="#080b12"/>
  <!-- Piano key shape (white key outline) -->
  <rect x="10" y="6" width="8" height="14" rx="1.5" fill="none" stroke="#4ff7c0" stroke-width="1.5"/>
  <!-- Black key overlay -->
  <rect x="13.5" y="6" width="4" height="8" rx="1" fill="#4ff7c0" opacity="0.9"/>
  <!-- Music note stem + flag -->
  <line x1="22" y1="10" x2="22" y2="20" stroke="#4ff7c0" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="20.2" cy="20.5" rx="2.2" ry="1.6" transform="rotate(-15 20.2 20.5)" fill="#4ff7c0"/>
  <path d="M22 10 Q27 9 26 13" stroke="#4ff7c0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Subtle glow dot -->
  <circle cx="16" cy="25" r="1.2" fill="#4ff7c0" opacity="0.5"/>
</svg>
